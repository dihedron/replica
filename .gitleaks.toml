# Gitleaks configuration: the default rules, plus an allowlist for paths that
# git ignores and that "make secrets" still sees when it scans the working
# tree: build output. It is never committed.
title = "replica"

[extend]
useDefault = true

[allowlist]
description = "git-ignored build output"
paths = ['''(^|/)dist/''', '''(^|/)build/''']
