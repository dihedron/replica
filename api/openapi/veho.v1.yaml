openapi: 3.1.0
info:
  title: veho API
  version: v1
  description: >-
    Durable replication of large objects to many destinations. Generated from api/veho/v1/*.proto (.specs/veho-api-server.md); gRPC serves the same services. Errors are RFC 9457 problem+json documents with a stable code.


    ## veho.v1.PolicyService


    PolicyService manages named policies and who may use them.


    ## veho.v1.EndpointService


    EndpointService manages the tenant's storage endpoints.


    ## veho.v1.SecretService


    SecretService manages the tenant's secrets: write-only (SEC-9).


    ## veho.v1.TenantService


    TenantService manages the tenants: platform administrators only.


    ## veho.v1.AdminService


    AdminService administers the caller's tenant: its API keys, its

     entitlements and its settings.

    ## veho.v1.JobService


    JobService accepts, shows, cancels and retries replication jobs.


    ## veho.v1.WebhookService


    WebhookService manages the tenant's webhooks.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://veho.example:8443
security:
  - bearer: []
components:
  responses:
    Problem:
      description: An error, as RFC 9457 problem+json (.specs/veho-api-server.md §6).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - retryable
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: The stable reason of the error, as in the gRPC ErrorInfo.
        retryable:
          type: boolean
    google.protobuf.Duration:
      type: string
      pattern: ^-?[0-9]+(\.[0-9]{1,9})?s$
      description: A signed duration in seconds, with up to nine fractional digits and an `s` suffix (for example, `3s` or `-0.001s`).
    google.protobuf.Struct:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON object whose property values may be any JSON value.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    google.protobuf.Value:
      oneOf:
        - type: "null"
        - type: number
        - type: string
        - type: boolean
        - type: array
        - type: object
          additionalProperties: true
      description: 'Any JSON value: `null`, number, string, boolean, array, or object.'
    veho.v1.ApiKey:
      type: object
      properties:
        id:
          type: string
          title: id
        principal:
          type: string
          title: principal
        role:
          type: string
          title: role
        created_at:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        expires_at:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        revoked_at:
          title: revoked_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        last_used_at:
          title: last_used_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ApiKey
      additionalProperties: false
    veho.v1.Copies:
      type: object
      properties:
        done:
          type: integer
          title: done
          format: int32
        total:
          type: integer
          title: total
          format: int32
      title: Copies
      additionalProperties: false
    veho.v1.CreateJobRequest:
      type: object
      properties:
        idempotency_key:
          type: string
          title: idempotency_key
        source:
          title: source
          $ref: '#/components/schemas/veho.v1.ObjectRef'
        policy:
          title: policy
          description: |-
            An inline policy document (.specs/veho-distribution-policy.md), or
             policy_ref: exactly one of them.
          $ref: '#/components/schemas/google.protobuf.Struct'
        labels:
          type: object
          title: labels
          additionalProperties:
            type: string
            title: value
        policy_ref:
          title: policy_ref
          $ref: '#/components/schemas/veho.v1.PolicyRef'
      title: CreateJobRequest
      additionalProperties: false
    veho.v1.CreateKeyRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: The principal's name, unique in the tenant.
        role:
          type: string
          title: role
        expires_in:
          type: string
          title: expires_in
          format: int64
          description: Seconds from now; 0 never expires.
      title: CreateKeyRequest
      additionalProperties: false
    veho.v1.CreatePolicyRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        policy:
          title: policy
          $ref: '#/components/schemas/google.protobuf.Struct'
      title: CreatePolicyRequest
      additionalProperties: false
    veho.v1.CreateTenantRequest:
      type: object
      properties:
        name:
          type: string
          title: name
      title: CreateTenantRequest
      additionalProperties: false
    veho.v1.CreateWebhookRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        url:
          type: string
          title: url
        events:
          type: array
          items:
            type: string
          title: events
      title: CreateWebhookRequest
      additionalProperties: false
    veho.v1.CreatedKey:
      type: object
      properties:
        id:
          type: string
          title: id
        key:
          type: string
          title: key
          description: 'The key: shown once.'
      title: CreatedKey
      additionalProperties: false
    veho.v1.CreatedWebhook:
      type: object
      properties:
        webhook:
          title: webhook
          $ref: '#/components/schemas/veho.v1.Webhook'
        secret:
          type: string
          title: secret
          description: The secret that signs the deliveries; shown once.
      title: CreatedWebhook
      additionalProperties: false
    veho.v1.Empty:
      type: object
      title: Empty
      additionalProperties: false
    veho.v1.Endpoint:
      type: object
      properties:
        name:
          type: string
          title: name
        driver:
          type: string
          title: driver
        location:
          type: string
          title: location
        config:
          title: config
          $ref: '#/components/schemas/google.protobuf.Struct'
        credential_ref:
          type: string
          title: credential_ref
          description: db://<secret name>, or empty.
        created_at:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Endpoint
      additionalProperties: false
    veho.v1.EndpointCheck:
      type: object
      properties:
        id:
          type: string
          title: id
        endpoint:
          type: string
          title: endpoint
        created_at:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        state:
          type: string
          title: state
          description: running, complete, expired.
        error:
          type: string
          title: error
          description: Why the flows could not be found.
        flows:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Flow'
          title: flows
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.NodeCheck'
          title: nodes
      title: EndpointCheck
      additionalProperties: false
    veho.v1.EndpointTest:
      type: object
      properties:
        ok:
          type: boolean
          title: ok
        step:
          type: string
          title: step
          description: 'The step that failed: open, stat, write, delete.'
        code:
          type: string
          title: code
        message:
          type: string
          title: message
      title: EndpointTest
      additionalProperties: false
    veho.v1.Entitlement:
      type: object
      properties:
        id:
          type: string
          title: id
        kind:
          type: string
          title: kind
          description: oidc or spiffe.
        issuer:
          type: string
          title: issuer
        subject:
          type: string
          title: subject
        group:
          type: string
          title: group
        role:
          type: string
          title: role
        created_at:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Entitlement
      additionalProperties: false
    veho.v1.Flow:
      type: object
      properties:
        purpose:
          type: string
          title: purpose
        host:
          type: string
          title: host
        port:
          type: integer
          title: port
          format: int32
        tls:
          type: boolean
          title: tls
        server_name:
          type: string
          title: server_name
        handshake:
          type: string
          title: handshake
          description: '"": TCP, or TLS with tls; "ssh".'
        unprobed:
          type: string
          title: unprobed
          description: Why the flow is not probed, if so.
      title: Flow
      additionalProperties: false
      description: A network flow of an endpoint, from an executor to host:port.
    veho.v1.FlowResult:
      type: object
      properties:
        purpose:
          type: string
          title: purpose
        host:
          type: string
          title: host
        port:
          type: integer
          title: port
          format: int32
        address:
          type: string
          title: address
          description: Empty when no address was probed.
        protocol:
          type: string
          title: protocol
          description: tcp, tls, ssh.
        status:
          type: string
          title: status
          description: reachable, unreachable, skipped.
        reason:
          type: string
          title: reason
        latency_ms:
          type: string
          title: latency_ms
          format: int64
      title: FlowResult
      additionalProperties: false
      description: One flow's outcome at one address, from one node.
    veho.v1.Grant:
      type: object
      properties:
        grantee:
          type: string
          title: grantee
          description: key:<name>, oidc:<sub>, spiffe:<id> or group:<name>.
        permission:
          type: string
          title: permission
          description: submit, read or manage.
      title: Grant
      additionalProperties: false
    veho.v1.Grants:
      type: object
      properties:
        name:
          type: string
          title: name
        grants:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Grant'
          title: grants
      title: Grants
      additionalProperties: false
    veho.v1.Job:
      type: object
      properties:
        id:
          type: string
          title: id
        state:
          type: string
          title: state
        source:
          title: source
          $ref: '#/components/schemas/veho.v1.Source'
        policy_ref:
          title: policy_ref
          description: The named policy the job was submitted under, if any.
          $ref: '#/components/schemas/veho.v1.PolicyRef'
        labels:
          type: object
          title: labels
          additionalProperties:
            type: string
            title: value
        created_at:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updated_at:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        deadline_at:
          title: deadline_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        satisfied_at:
          title: satisfied_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        completed_at:
          title: completed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        settled_at:
          title: settled_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        copies:
          title: copies
          $ref: '#/components/schemas/veho.v1.Copies'
        progress:
          oneOf:
            - type: number
              format: double
            - type: string
              enum:
                - NaN
                - Infinity
                - -Infinity
          title: progress
        last_error:
          title: last_error
          $ref: '#/components/schemas/veho.v1.Problem'
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Transfer'
          title: transfers
      title: Job
      additionalProperties: false
    veho.v1.ListEndpointChecksResponse:
      type: object
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.EndpointCheck'
          title: checks
      title: ListEndpointChecksResponse
      additionalProperties: false
    veho.v1.ListEndpointsResponse:
      type: object
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Endpoint'
          title: endpoints
      title: ListEndpointsResponse
      additionalProperties: false
    veho.v1.ListEntitlementsResponse:
      type: object
      properties:
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Entitlement'
          title: entitlements
      title: ListEntitlementsResponse
      additionalProperties: false
    veho.v1.ListJobsResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Job'
          title: jobs
        next_cursor:
          type: string
          title: next_cursor
      title: ListJobsResponse
      additionalProperties: false
    veho.v1.ListKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.ApiKey'
          title: keys
      title: ListKeysResponse
      additionalProperties: false
    veho.v1.ListPoliciesResponse:
      type: object
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Policy'
          title: policies
      title: ListPoliciesResponse
      additionalProperties: false
    veho.v1.ListSecretsResponse:
      type: object
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Secret'
          title: secrets
      title: ListSecretsResponse
      additionalProperties: false
    veho.v1.ListTenantsResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Tenant'
          title: tenants
      title: ListTenantsResponse
      additionalProperties: false
    veho.v1.ListTransfersResponse:
      type: object
      properties:
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Transfer'
          title: transfers
      title: ListTransfersResponse
      additionalProperties: false
    veho.v1.ListWebhooksResponse:
      type: object
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.Webhook'
          title: webhooks
      title: ListWebhooksResponse
      additionalProperties: false
    veho.v1.NodeCheck:
      type: object
      properties:
        node:
          type: string
          title: node
        region:
          type: string
          title: region
        answered:
          type: boolean
          title: answered
        checked_at:
          title: checked_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        results:
          type: array
          items:
            $ref: '#/components/schemas/veho.v1.FlowResult'
          title: results
      title: NodeCheck
      additionalProperties: false
    veho.v1.ObjectRef:
      type: object
      properties:
        endpoint:
          type: string
          title: endpoint
        path:
          type: string
          title: path
      title: ObjectRef
      additionalProperties: false
      description: ObjectRef is an object on one of the tenant's endpoints.
    veho.v1.Policy:
      type: object
      properties:
        name:
          type: string
          title: name
        version:
          type: integer
          title: version
          format: int32
        policy:
          title: policy
          $ref: '#/components/schemas/google.protobuf.Struct'
        created_at:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Policy
      additionalProperties: false
    veho.v1.PolicyRef:
      type: object
      properties:
        name:
          type: string
          title: name
        version:
          type: integer
          title: version
          format: int32
      title: PolicyRef
      additionalProperties: false
      description: PolicyRef names a version of a named policy; version 0 is the latest.
    veho.v1.Problem:
      type: object
      properties:
        code:
          type: string
          title: code
        message:
          type: string
          title: message
      title: Problem
      additionalProperties: false
      description: Problem is a job's or a transfer's last error.
    veho.v1.Quotas:
      type: object
      properties:
        max_destinations:
          type: integer
          title: max_destinations
          format: int32
        max_active_jobs:
          type: integer
          title: max_active_jobs
          format: int32
        min_retry_initial:
          title: min_retry_initial
          description: |-
            The shortest retry.initial a policy may set (FR-12); at most 2s, so that
             the policy default stays valid; unset is 1s.
          $ref: '#/components/schemas/google.protobuf.Duration'
        max_retry_interval:
          title: max_retry_interval
          description: |-
            The longest retry.max_interval a policy may set (FR-12); at least 15m, so
             that the policy default stays valid; unset is 1h.
          $ref: '#/components/schemas/google.protobuf.Duration'
      title: Quotas
      additionalProperties: false
    veho.v1.Secret:
      type: object
      properties:
        name:
          type: string
          title: name
        version:
          type: integer
          title: version
          format: int32
        kek_version:
          type: integer
          title: kek_version
          format: int32
        created_at:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updated_at:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Secret
      additionalProperties: false
      description: 'Secret is what the API shows of a secret: never its value.'
    veho.v1.Source:
      type: object
      properties:
        endpoint:
          type: string
          title: endpoint
        path:
          type: string
          title: path
        size:
          type: string
          title: size
          format: int64
        version:
          type: string
          title: version
      title: Source
      additionalProperties: false
    veho.v1.Tenant:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        state:
          type: string
          title: state
          description: active or suspended.
        quotas:
          title: quotas
          $ref: '#/components/schemas/veho.v1.Quotas'
        settings:
          title: settings
          $ref: '#/components/schemas/veho.v1.TenantSettings'
        created_at:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Tenant
      additionalProperties: false
    veho.v1.TenantSettings:
      type: object
      properties:
        inline_policies:
          type: string
          title: inline_policies
          description: all, granted or none.
      title: TenantSettings
      additionalProperties: false
    veho.v1.Transfer:
      type: object
      properties:
        id:
          type: string
          title: id
        endpoint:
          type: string
          title: endpoint
        path:
          type: string
          title: path
        position:
          type: object
          title: position
          additionalProperties:
            type: string
            title: value
        state:
          type: string
          title: state
        bytes_done:
          type: string
          title: bytes_done
          format: int64
        bytes_total:
          type: string
          title: bytes_total
          format: int64
        attempt:
          type: integer
          title: attempt
          format: int32
        last_error:
          title: last_error
          $ref: '#/components/schemas/veho.v1.Problem'
        finished_at:
          title: finished_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Transfer
      additionalProperties: false
    veho.v1.ValidatePolicyRequest:
      type: object
      properties:
        policy:
          title: policy
          $ref: '#/components/schemas/google.protobuf.Struct'
      title: ValidatePolicyRequest
      additionalProperties: false
    veho.v1.ValidatePolicyResponse:
      type: object
      properties:
        valid:
          type: boolean
          title: valid
        code:
          type: string
          title: code
          description: The first problem, when not valid.
        message:
          type: string
          title: message
      title: ValidatePolicyResponse
      additionalProperties: false
    veho.v1.Webhook:
      type: object
      properties:
        name:
          type: string
          title: name
        url:
          type: string
          title: url
          description: https only, no user information.
        events:
          type: array
          items:
            type: string
          title: events
          description: job.succeeded, job.failed, job.cancelled.
        enabled:
          type: boolean
          title: enabled
        disabled_reason:
          type: string
          title: disabled_reason
          description: Why veho or the tenant switched it off.
        consecutive_failures:
          type: integer
          title: consecutive_failures
          format: int32
        created_at:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        last_success_at:
          title: last_success_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        last_failure_at:
          title: last_failure_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Webhook
      additionalProperties: false
    veho.v1.WebhookSecret:
      type: object
      properties:
        secret:
          type: string
          title: secret
      title: WebhookSecret
      additionalProperties: false
    veho.v1.WebhookTest:
      type: object
      properties:
        ok:
          type: boolean
          title: ok
        status:
          type: integer
          title: status
          format: int32
          description: The HTTP status the receiver answered, if any.
        class:
          type: string
          title: class
          description: ok, status, forbidden, timeout, connect, tls.
      title: WebhookTest
      additionalProperties: false
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API key (veho_...), an OIDC token or a JWT-SVID; or a client X.509-SVID over mTLS.
paths:
  /v1/admin/entitlements:
    get:
      tags:
        - veho.v1.AdminService
      summary: ListEntitlements
      operationId: veho.v1.AdminService.ListEntitlements
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veho.v1.ListEntitlementsResponse'
        "4XX":
          $ref: '#/components/responses/Problem'
        "5XX":
          $ref: '#/components/responses/Problem'
    post:
      tags:
        - veho.v1.AdminService
      summary: CreateEntitlement
      operationId: veho.v1.AdminService.CreateEntitlement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/veho.v1.Entitlement'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veho.v1.Entitlement'
        "4XX":
          $ref: '#/components/responses/Problem'
        "5XX":
          $ref: '#/components/responses/Problem'
  /v1/admin/entitlements/{id}:
    delete:
      tags:
        - veho.v1.AdminService
      summary: DeleteEntitlement
      operationId: veho.v1.AdminService.DeleteEntitlement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            title: id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veho.v1.Empty'
        "4XX":
          $ref: '#/components/responses/Problem'
        "5XX":
          $ref: '#/components/responses/Problem'
  /v1/admin/keys:
    get:
      tags:
        - veho.v1.AdminService
      summary: ListKeys
      operationId: veho.v1.AdminService.ListKeys
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/veho.v1.ListKeysResponse'
        "4XX":
          $ref: '#/components/responses/Problem'
        "5XX":
          $ref: '#/components/responses/Problem'
    post:
      tags:
        - veho.v1.AdminService
      summary: CreateKey
      description: CreateKey returns the key in this answer only.
      operationId: veho.v1.AdminService.CreateKey
      requestBody:
        content:
