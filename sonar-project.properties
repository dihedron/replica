# SonarQube Cloud analysis, run by the "Build and test" job of
# .github/workflows/ci.yml after the tests (Automatic Analysis must be off).
sonar.projectKey=dihedron_veho
sonar.organization=dihedron
sonar.projectName=veho
sonar.sourceEncoding=UTF-8

# Go code; tests apart. The spikes are disposable test tooling.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,test/spikes/**,test/labtest/**,dist/**,**/testdata/**,**/*.pb.go,**/*.pb.gw.go

# coverage of "go test ./... -coverprofile=coverage.txt" in the same job
sonar.go.coverage.reportPaths=coverage.txt

# profiling is opt-in: off unless the operator sets <BINARY>_CPU_PROFILE or
# <BINARY>_MEM_PROFILE, which needs control of the process environment.
sonar.issue.ignore.multicriteria=prof,sqlnull,labhttp,labhttpgo,labmd5
sonar.issue.ignore.multicriteria.prof.ruleKey=go:S4507
sonar.issue.ignore.multicriteria.prof.resourceKey=cmd/*/init.go
# CHECK (x <> '') compares with the empty string: the rule assumes Oracle,
# where '' is NULL; in PostgreSQL it is not.
sonar.issue.ignore.multicriteria.sqlnull.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.sqlnull.resourceKey=migrations/*.sql
# the lab's S3 (Garage) is reached over plain HTTP inside the lab's private
# networks (veho-lab.md §5), and S3's Content-MD5 requires MD5
sonar.issue.ignore.multicriteria.labhttp.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.labhttp.resourceKey=test/lab/**
sonar.issue.ignore.multicriteria.labhttpgo.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.labhttpgo.resourceKey=test/labtest/**
sonar.issue.ignore.multicriteria.labmd5.ruleKey=shell:S4790
sonar.issue.ignore.multicriteria.labmd5.resourceKey=test/lab/**
