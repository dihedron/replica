# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: veho

env:
  - CGO_ENABLED=0
#  - _GO_MK_VARS_NAME={{ .Env._GO_MK_VARS_NAME}}
#  - _GO_MK_VARS_METADATA_PACKAGE={{ .Env._GO_MK_VARS_METADATA_PACKAGE }}
before:
  hooks:
    - go mod download
    - go mod tidy
    - go generate ./...

builds:
  - id: veho
    binary: veho
    main: ./cmd/veho
    # Linux only (NFR-6): Windows and macOS are not supported; the BSDs may
    # come later, as tier 2 (backlog 33)
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
      - v2
      - v3
    tags:
      - osusergo
      - netgo
      - static_build
    flags:
      - -trimpath
    ldflags: &ldflags
      - -s -w
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Name={{.Env._GO_MK_VARS_NAME}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Description={{.Env._GO_MK_VARS_DESCRIPTION}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Copyright={{.Env._GO_MK_VARS_COPYRIGHT}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.License={{.Env._GO_MK_VARS_LICENSE}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.LicenseURL={{.Env._GO_MK_VARS_LICENSE_URL}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Version={{.Version}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.VersionMajor={{.Major}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.VersionMinor={{.Minor}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.VersionPatch={{.Patch}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Vendor={{.Env._GO_MK_VARS_VENDOR}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.Maintainer={{.Env._GO_MK_VARS_MAINTAINER}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.DotEnvVarName={{.Env._GO_MK_VARS_DOTENV_VAR_NAME}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.BuildTime={{.Now}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitTag={{.Tag}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitCommit={{.Commit}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitTime={{.CommitDate}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitTreeState={{.GitTreeState}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GitBranch={{.Branch}}'
      - -X '{{.Env._GO_MK_VARS_METADATA_PACKAGE}}.GoReleaserVersion={{.Env._GORELEASER_VERSION}}'
    mod_timestamp: "{{ .CommitTimestamp }}"

  # the drivers with third-party dependencies are plugins, each a binary and a
  # package of its own, with a signed manifest (.specs/veho-plugin-distribution.md);
  # one amd64 level, so that one manifest matches the one packaged binary
  - id: veho-plugin-s3
    binary: veho-plugin-s3
    main: ./cmd/veho-plugin-s3
    goos: [linux]
    goarch: [amd64, arm64]
    goamd64: [v1]
    tags: [osusergo, netgo, static_build]
    flags: [-trimpath]
    ldflags: *ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: go run ./tools/plugin-manifest sign -name s3 -version {{ .Version }} -out build/plugins/{{ .Os }}_{{ .Arch }} {{ if .IsSnapshot }}-allow-unsigned{{ end }} {{ .Path }}
          output: true

archives:
  - id: veho-plugin-s3
    ids: [veho-plugin-s3]
    formats: [tar.gz]
    name_template: >-
      veho-plugin-s3_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - src: "build/plugins/{{ .Os }}_{{ .Arch }}/veho-plugin-s3.manifest*"
        strip_parent: true

  - id: veho
    ids: [veho]
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}{{ .Arm }}{{ end }}
      {{- if .Amd64 }}{{ .Amd64 }}{{ end }}

upx:
  - # Whether to enable it or not.
    #
    # Templates: allowed.
    enabled: false

    # Filter by build ID.
    ids: [veho]

    # Filter by GOOS.
    goos: [linux]

    # Filter by GOARCH.
    goarch: [amd64, arm64]

    # Filter by GOAMD64.
    goamd64: [v1, v2, v3]

    # Compress argument.
    # Valid options are from '1' (faster) to '9' (better), and 'best'.
    compress: "9"

    # Whether to try LZMA (slower).
    lzma: true

    # Whether to try all methods and filters (slow).
    #brute: true

nfpms:
  - id: veho
    package_name: veho
    ids:
      - veho
    description: |
      veho replicates large objects, durably and asynchronously, from a
      source storage system to destinations in two other regions: it
      records each job in a PostgreSQL cluster spread across the regions,
      resumes it on another node if one fails, retries what fails and
      verifies every copy. Storage backends are plugins; the service is
      multi-tenant.
    homepage: "https://github.com/dihedron/veho"
    maintainer: "Andrea Funtò <dihedron.dev@gmail.com>"
    vendor: "Andrea Funtò"
    license: "MIT"
    formats:
      - rpm
      - deb
      - apk
    epoch: "1"
    release: "1"
    section: default
    priority: "optional"
    # signed with the packaging key when GPG_KEY_FILE names its armored
    # private key (passphrase in NFPM_PASSPHRASE); unsigned otherwise
    rpm:
      signature:
        key_file: '{{ if index .Env "GPG_KEY_FILE" }}{{ .Env.GPG_KEY_FILE }}{{ end }}'
    deb:
      signature:
        key_file: '{{ if index .Env "GPG_KEY_FILE" }}{{ .Env.GPG_KEY_FILE }}{{ end }}'
        type: origin
    contents:
      - src: ./packaging/veho.service
        dst: /usr/lib/systemd/system/veho.service
        file_info:
          mode: 0644
      # run once by the database administrator (the Setup Guide)
      - src: ./packaging/postgres/roles.sql
        dst: /usr/share/veho/postgres/roles.sql
        file_info:
          mode: 0644
    scripts:
      postinstall: ./packaging/postinstall.sh

  - id: veho-plugin-s3
    package_name: veho-plugin-s3
    ids: [veho-plugin-s3]
    description: |
      The S3 storage driver of veho, as a process plugin: veho starts it when
      its configuration lists the s3 driver, after checking its signed
      manifest. Any S3-compatible service.
    homepage: "https://github.com/dihedron/veho"
    maintainer: "Andrea Funtò <dihedron.dev@gmail.com>"
    vendor: "Andrea Funtò"
    license: "MIT"
    formats: [rpm, deb]
    epoch: "1"
    release: "1"
    section: default
    priority: "optional"
    bindir: /usr/libexec/veho/plugins
    # nfpm does not template dependencies: veho itself refuses a plugin of
    # another release at start (its manifest's version, PD-2)
    dependencies: [veho]
    rpm:
      signature:
        key_file: '{{ if index .Env "GPG_KEY_FILE" }}{{ .Env.GPG_KEY_FILE }}{{ end }}'
    deb:
      signature:
        key_file: '{{ if index .Env "GPG_KEY_FILE" }}{{ .Env.GPG_KEY_FILE }}{{ end }}'
        type: origin
    contents:
      - src: "build/plugins/{{ .Os }}_{{ .Arch }}/veho-plugin-s3.manifest"
        dst: /usr/libexec/veho/plugins/veho-plugin-s3.manifest
        file_info: {mode: 0644}
      - src: "build/plugins/{{ .Os }}_{{ .Arch }}/veho-plugin-s3.manifest.sig"
        dst: /usr/libexec/veho/plugins/veho-plugin-s3.manifest.sig
        file_info: {mode: 0644}

# MSI packaging is a GoReleaser Pro feature.
# If you have GoReleaser Pro, you can uncomment the following section.
# packagers:
#   - id: veho-msi
#     name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
#     builds:
#       - veho
#     extra_files:
#       - src: ./veho.conf
#     upgrade_code: "53c6e944-a35a-4e67-b3b9-8c9e7a8a0a3a"
#     msi:
#       component_id: Netcheck
#       directory_id: Netcheck

source:
  enabled: true
  # the archive extension is appended by goreleaser
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
sboms:
  - cmd: syft
    documents:
      - "${artifact}.cdx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document", "-vvv"]
    artifacts: package
    disable: false

checksum:
  name_template: "checksums.txt"
  # the release documents too (make release builds them first): the signature
  # of the checksums file then covers them like the packages (T-21)
  extra_files:
    - glob: ./build/docs/*.pdf

# the checksums file covers every archive, package and SBOM: its detached
# signature, made with the packaging key whose fingerprint is in
# GPG_FINGERPRINT, vouches for all of them. make snapshot skips it when
# GPG_FINGERPRINT is unset; make release requires it.
signs:
  - id: checksums
    artifacts: checksum
    signature: "${artifact}.asc"
    args:
      - --batch
      - --yes
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --armor
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

release:
  # the release documents (make release builds them first): .specs/veho-docs.md
  extra_files:
    - glob: ./build/docs/*.pdf
  footer: |
    ---
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
