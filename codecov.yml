# Codecov: test tooling (the disposable DBOS spike, the lab's helpers, run
# only by the lab's suites) and generated code
# (protobuf, gRPC, the REST gateway) are left out of the coverage figures,
# as in sonar-project.properties.
ignore:
  - "test/spikes/**"
  - "test/labtest/**"
  - "**/*.pb.go"
  - "**/*.pb.gw.go"

# The same bar as SonarCloud's gate on new code; the project may dip by 1%
# (error-only branches) without failing a pull request.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
